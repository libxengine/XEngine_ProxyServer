name: MintLinux build workflows

on:
  push:
    branches:
      - 'develop'

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.name }}/${{ matrix.version }}-${{ matrix.arch }}:latest
      options: --platform ${{ matrix.platform }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            name: linuxmintd
            version: mint22.3
            platform: linux/amd64

    steps:
      - name: Checkout main repository code
        uses: actions/checkout@v7

      - name: Checkout dependency repository (xengine)
        uses: actions/checkout@v7
        with:
          repository: libxengine/libxengine
          path: libxengine

      - name: sub module checkout (opensource)
        uses: actions/checkout@v7
        with:
          repository: libxengine/XEngine_OPenSource
          path: XEngine_Source/XEngine_DependLibrary

      - name: Set TERM variable
        run: echo "TERM=xterm" >> $GITHUB_ENV

      - name: Set up Dependency ubuntu24.04 Environment
        run: |
            cat /etc/os-release
            cd libxengine
            chmod 777 *
            sudo ./XEngine_LINEnv.sh -i 3

      - name: make
        run: | 
            cd XEngine_Source
            make
            make FLAGS=InstallAll
            make FLAGS=CleanAll

            make RELEASE=1
            make FLAGS=InstallAll
            make FLAGS=CleanAll
            cd ..
      - name: test
        run: |
            cd XEngine_Release
            ./XEngine_ProxyServiceApp -t

      - name: Upload folder as artifact 
        uses: actions/upload-artifact@v7
        with:
          name: XEngine_ProxyServiceApp-Mint_x86_64
          path: XEngine_Release/
          retention-days: 1